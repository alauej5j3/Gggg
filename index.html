<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>單字翻頁學習</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="page">
    <header>
      <h1>高中英文單字卡</h1>
      <a class="admin-link" href="admin.html">管理頁面</a>
    </header>

    <section class="card-container">
      <div class="card" id="card">
        <div class="card-face card-front" id="cardFront">
          <div class="word-text" id="wordText"></div>
          <div class="word-detail" id="wordMeaning"></div>
        </div>
        <div class="card-face card-back" id="cardBack">
          <div>
            <p><strong>中文解釋：</strong><span id="backMeaning"></span></p>
            <p><strong>詞性：</strong><span id="backPos"></span></p>
            <p><strong>例句：</strong><span id="backExample"></span></p>
            <p><strong>字根分析：</strong><span id="backRoot"></span></p>
          </div>
        </div>
      </div>
    </section>

    <section class="controls">
      <button id="prevButton">上一個</button>
      <button id="flipButton">翻頁</button>
      <button id="nextButton">下一個</button>
    </section>

    <footer>
      <p>點擊卡片或按「翻頁」查看背面內容。</p>
    </footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
